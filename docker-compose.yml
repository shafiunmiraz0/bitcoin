services:
  bitcoin:
    container_name: bitcoin-pruned-node
    build: .
    restart: unless-stopped
    ports:
      - "8333:8333"
      - "8332:8332"
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin  # Docker-managed volume
    environment:
      BITCOIN_HOME: /home/bitcoin/.bitcoin

volumes:
  bitcoin-data:
    driver: local
