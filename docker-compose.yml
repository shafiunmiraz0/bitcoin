services:
  bitcoin:
    container_name: bitcoin-pruned-node
    build: .
    restart: unless-stopped
    ports:
      - "8333:8333"
      - "8332:8332"
      - "28332:28332"
      - "28333:28333"
    volumes:
      - ./bitcoin-data:/home/bitcoin/.bitcoin  # Bind mount to local directory
    environment:
      BITCOIN_HOME: /home/bitcoin/.bitcoin
    networks:
      - bitcoin-network

  web-dashboard:
    container_name: bitcoin-dashboard
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BITCOIN_HOST: bitcoin
      BITCOIN_PORT: 8332
      BITCOIN_USER: bitcoinuser
      BITCOIN_PASSWORD: CHANGE_THIS_TO_A_STRONG_PASSWORD
      PORT: 3000
    depends_on:
      - bitcoin
    networks:
      - bitcoin-network

  lnd:
    container_name: lnd
    image: lightninglabs/lnd:v0.19.0-beta
    restart: unless-stopped
    ports:
      - "9735:9735"
      - "10009:10009"
    volumes:
      - ./lnd-data:/root/.lnd
    command: >
      lnd
      --bitcoin.active
      --bitcoin.mainnet
      --bitcoin.node=bitcoind
      --bitcoind.rpchost=bitcoin-pruned-node
      --bitcoind.rpcuser=bitcoinuser
      --bitcoind.rpcpass=CHANGE_THIS_TO_A_STRONG_PASSWORD
      --bitcoind.zmqpubrawblock=tcp://bitcoin-pruned-node:28332
      --bitcoind.zmqpubrawtx=tcp://bitcoin-pruned-node:28333
    depends_on:
      - bitcoin
    networks:
      - bitcoin-network

volumes:
  lnd-data:

networks:
  bitcoin-network:
    driver: bridge
