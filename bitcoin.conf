# ==============================
# NETWORK
# ==============================
server=1
listen=1
maxconnections=50  # Reduced from 40 to save resources (optional)

# ==============================
# PRUNING (Limit Disk to ~55GB)
# ==============================
prune=58000     # MB (≈ 55 GB)

# ==============================
# TRANSACTION MODE
# ==============================
txindex=0       # DISABLED: Incompatible with prune mode
mempoolfullrbf=1

# ==============================
# RPC SETTINGS (Secure)
# ==============================
rpcbind=0.0.0.0
rpcallowip=127.0.0.1
rpcallowip=172.16.0.0/12     # Docker safe subnet (optional)
rpcuser=bitcoinuser
rpcpassword=CHANGE_THIS_TO_A_STRONG_PASSWORD

# ==============================
# PERFORMANCE TUNING
# ==============================
# dbcache=2048          # 1GB RAM cache (increase if possible)
# maxmempool=300        # MB mempool size
# maxorphantx=100
dbcache=12288           # # or 4096 if 16GB RAM
par=10                   # Parallel script verification threads (default: # of cores)
maxmempool=300        # MB mempool size

# ==============================
# WALLET (Optional)
# ==============================
wallet=wallet.dat

# ==============================
# LOGGING
# ==============================
logtimestamps=1
debug=0 #rpc
debug=0 # mempool

# ==============================
# ZMQ SETTINGS (For LND)
# ==============================
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333

# ==============================
# SECURITY HARDENING
# ==============================
disablewallet=1 # 1 to disable wallet functionality (optional, but recommended for a node that doesn't need it)
dnsseed=1
upnp=0
natpmp=0
