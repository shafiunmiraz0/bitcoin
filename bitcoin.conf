# ==============================
# NETWORK
# ==============================
server=1
listen=1
maxconnections=40

# ==============================
# PRUNING (Limit Disk to ~40GB)
# ==============================
prune=120000     # MB (≈ 120 GB)

# ==============================
# TRANSACTION MODE
# ==============================
txindex=0       # Save disk (not needed for tx relay)
mempoolfullrbf=1

# ==============================
# RPC SETTINGS (Secure)
# ==============================
rpcbind=0.0.0.0
rpcallowip=127.0.0.1
rpcallowip=172.16.0.0/12     # Docker safe subnet (optional)
rpcuser=bitcoinuser
rpcpassword=CHANGE_THIS_TO_A_STRONG_PASSWORD

# ==============================
# PERFORMANCE TUNING
# ==============================
dbcache=1024          # 1GB RAM cache (increase if possible)
maxmempool=300        # MB mempool size
maxorphantx=100

# ==============================
# WALLET (Optional)
# ==============================
wallet=wallet.dat

# ==============================
# LOGGING
# ==============================
logtimestamps=1
debug=rpc
debug=mempool

# ==============================
# SECURITY HARDENING
# ==============================
disablewallet=0
dnsseed=1
upnp=0
natpmp=0
